<!DOCTYPE html>
<html>
<head>
    <title>JSExplorer</title>
    <script>
        const start_titel = 'JSExplorer';
    </script>
    <style>
        body {
            margin: 0;
            font-family: Georgia, 'Times New Roman', serif;
            background: linear-gradient(180deg, #f8f5ee 0%, #ece4d8 100%);
            color: #1e1b18;
        }

        .explorer {
            display: grid;
            grid-template-rows: auto auto auto 1fr auto;
            height: 100vh;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.55);
        }

        .plugin-toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar button {
            border: 1px solid #b89d77;
            background: #fffaf1;
            border-radius: 999px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .pathbar {
            padding: 0 12px 12px;
        }

        .pathbar input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #c8b99f;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.8);
        }

        .listing {
            padding: 12px;
            display: grid;
            gap: 8px;
            align-content: start;
            overflow: auto;
        }

        .delete-controls {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.62);
        }

        .delete-controls.bottom {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            border-bottom: 0;
        }

        .delete-controls.hidden {
            display: none;
        }

        .delete-mode-badge {
            margin-left: auto;
            font-size: 12px;
            color: #675846;
            align-self: center;
        }

        .entry {
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .entry:hover,
        .entry.active {
            background: #fff;
            border-color: #b89d77;
        }

        .entry-name {
            font-weight: 700;
        }

        .entry-meta {
            font-size: 12px;
            color: #675846;
            margin-top: 4px;
        }

        .entry-main {
            min-width: 0;
        }

        .entry-delete-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .status {
            position: fixed;
            right: 12px;
            bottom: 12px;
            background: rgba(30, 27, 24, 0.9);
            color: #fff;
            padding: 8px 10px;
            border-radius: 8px;
            display: none;
        }

        .menu {
            position: fixed;
            min-width: 200px;
            background: #fff;
            border: 1px solid #c8b99f;
            border-radius: 10px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
            padding: 8px;
            display: none;
            z-index: 1000;
        }

        .menu button {
            width: 100%;
            text-align: left;
            border: 0;
            background: transparent;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
        }

        .menu button:hover {
            background: #f4ead9;
        }
    </style>
</head>
<body>
    <div class="explorer">
        <div class="toolbar">
            <button id="upButton">Up</button>
            <button id="refreshButton">Refresh</button>
            <button id="newFolderButton">New Folder</button>
            <button id="openButton">Open</button>
            <button id="openNotepadButton">Open In Notepad</button>
            <button id="deleteFilesButton">Delete Files</button>
            <div id="pluginToolbar" class="plugin-toolbar"></div>
        </div>
        <div class="pathbar">
            <input id="pathInput" type="text" value="" readonly>
        </div>
        <div id="deleteTopControls" class="delete-controls hidden">
            <button id="selectAllDeleteButton">Select all</button>
            <button id="unselectAllDeleteButton">Unselect all</button>
            <span class="delete-mode-badge">Delete mode</span>
        </div>
        <div id="listing" class="listing"></div>
        <div id="deleteBottomControls" class="delete-controls bottom hidden">
            <button id="confirmDeleteSelectedButton">Delete selected files</button>
            <button id="cancelDeleteModeButton">Cancel delete-mode</button>
        </div>
    </div>
    <div id="status" class="status"></div>
    <div id="menu" class="menu"></div>

    <script src="../../dialogs.js"></script>
    <script src="../../plugins-bridge.js"></script>
    <script>
        const listEndpoint = '../../fs/list';
        const executeActionsEndpoint = '../../actions/execute';
        const listActionsEndpoint = '../../actions/list';
        let currentPath = '';
        let selectedEntry = null;
        let preselectedName = '';
        let currentEntries = [];
        let isDeleteMode = false;
        let deleteSelection = new Set();

        async function renderPluginExtensions() {
            const container = document.getElementById('pluginToolbar');
            if (!container) {
                return;
            }

            container.innerHTML = '';

            if (!window.JSOSPlugins || typeof window.JSOSPlugins.getExtensions !== 'function') {
                return;
            }

            let extensions = [];
            try {
                extensions = await window.JSOSPlugins.getExtensions('jsexplorer.toolbar', {
                    path: currentPath,
                    selected: selectedEntry ? selectedEntry.path : ''
                });
            } catch (error) {
                return;
            }

            extensions.forEach((extension) => {
                const button = document.createElement('button');
                button.textContent = extension.label || extension.id || 'Plugin Action';
                button.addEventListener('click', async () => {
                    try {
                        await window.JSOSPlugins.executeExtension(extension, {
                            path: currentPath,
                            selectedEntry: selectedEntry
                        });
                    } catch (error) {
                        alert(error.message);
                    }
                });
                container.appendChild(button);
            });
        }

        function showStatus(message) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => {
                status.style.display = 'none';
            }, 2200);
        }

        async function fetchListing(path) {
            const response = await fetch(`${listEndpoint}?path=${encodeURIComponent(path || '')}`, { cache: 'no-store' });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `Listing failed (${response.status})`);
            }
            return data;
        }

        async function fetchActions(payload) {
            const response = await fetch(`${listActionsEndpoint}?target=jsexplorer&payload=${encodeURIComponent(JSON.stringify(payload || {}))}`, { cache: 'no-store' });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `Actions failed (${response.status})`);
            }
            return Array.isArray(data.actions) ? data.actions : [];
        }

        async function executeAction(actionId, payload) {
            const response = await fetch(executeActionsEndpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target: 'jsexplorer', action: actionId, payload: payload || {} })
            });
            const data = await response.json();
            if (!response.ok || data.status !== 'success') {
                throw new Error(data.message || `Action failed (${response.status})`);
            }
            return data;
        }

        function updateDeleteModeUi() {
            const top = document.getElementById('deleteTopControls');
            const bottom = document.getElementById('deleteBottomControls');
            top.classList.toggle('hidden', !isDeleteMode);
            bottom.classList.toggle('hidden', !isDeleteMode);
        }

        function isZipArchiveEntry(entry) {
            if (!entry) {
                return false;
            }
            const path = String(entry.path || '').toLowerCase();
            return entry.type === 'directory' && path.endsWith('.zip');
        }

        function isDeletableEntry(entry) {
            return !!entry && (entry.type === 'file' || isZipArchiveEntry(entry));
        }

        function getDeletableEntries() {
            return (currentEntries || []).filter((entry) => isDeletableEntry(entry));
        }

        function setDeleteMode(enabled) {
            isDeleteMode = !!enabled;
            if (!isDeleteMode) {
                deleteSelection = new Set();
            }
            selectedEntry = null;
            updateDeleteModeUi();
            renderEntries();
        }

        function toggleDeleteSelection(path, checked) {
            if (!path) {
                return;
            }

            if (checked) {
                deleteSelection.add(path);
            } else {
                deleteSelection.delete(path);
            }
        }

        function selectAllFiles() {
            deleteSelection = new Set(getDeletableEntries().map((entry) => entry.path));
            renderEntries();
        }

        function unselectAllFiles() {
            deleteSelection = new Set();
            renderEntries();
        }

        async function deleteSelectedFiles() {
            const selectedPaths = Array.from(deleteSelection);
            if (!selectedPaths.length) {
                alert('No files selected');
                return;
            }

            const ok = window.confirm(`Delete ${selectedPaths.length} selected file(s)?`);
            if (!ok) {
                return;
            }

            for (const filePath of selectedPaths) {
                await executeAction('jsexplorer.delete_file', { filePath: filePath });
            }

            showStatus(`Deleted ${selectedPaths.length} file(s)`);
            setDeleteMode(false);
            await loadListing(currentPath);
        }

        function renderEntries() {
            const container = document.getElementById('listing');
            container.innerHTML = '';

            if (!currentEntries.length) {
                const empty = document.createElement('div');
                empty.className = 'entry';
                empty.textContent = 'Folder is empty';
                container.appendChild(empty);
                return;
            }

            currentEntries.forEach((entry) => {
                const item = document.createElement('div');
                item.className = 'entry';

                if (isDeleteMode && isDeletableEntry(entry)) {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'entry-delete-checkbox';
                    checkbox.checked = deleteSelection.has(entry.path);
                    checkbox.addEventListener('click', (event) => event.stopPropagation());
                    checkbox.addEventListener('change', (event) => {
                        toggleDeleteSelection(entry.path, event.target.checked);
                    });
                    item.appendChild(checkbox);
                }

                const main = document.createElement('div');
                main.className = 'entry-main';

                const name = document.createElement('div');
                name.className = 'entry-name';
                name.textContent = entry.name;

                const meta = document.createElement('div');
                meta.className = 'entry-meta';
                meta.textContent = entry.type;

                main.appendChild(name);
                main.appendChild(meta);
                item.appendChild(main);

                if (preselectedName && entry.name === preselectedName) {
                    item.classList.add('active');
                    selectedEntry = entry;
                }

                if (!isDeleteMode) {
                    item.addEventListener('click', () => {
                        document.querySelectorAll('.entry').forEach((node) => node.classList.remove('active'));
                        item.classList.add('active');
                        selectedEntry = entry;
                    });
                    item.addEventListener('dblclick', () => {
                        openEntry(entry);
                    });
                    item.addEventListener('contextmenu', async (event) => {
                        event.preventDefault();
                        selectedEntry = entry;
                        document.querySelectorAll('.entry').forEach((node) => node.classList.remove('active'));
                        item.classList.add('active');
                        await openContextMenu(event.clientX, event.clientY, entry);
                    });
                } else if (isDeletableEntry(entry)) {
                    item.addEventListener('click', () => {
                        const shouldSelect = !deleteSelection.has(entry.path);
                        toggleDeleteSelection(entry.path, shouldSelect);
                        renderEntries();
                    });
                }

                container.appendChild(item);
            });
        }

        async function loadListing(path) {
            const listing = await fetchListing(path);
            currentPath = listing.path;
            selectedEntry = null;
            currentEntries = Array.isArray(listing.entries) ? listing.entries : [];
            document.getElementById('pathInput').value = currentPath || '/';

            try {
                if (window.parent && window.parent !== window) {
                    if (!window.parent.JSOSCmdContext || typeof window.parent.JSOSCmdContext !== 'object') {
                        window.parent.JSOSCmdContext = {};
                    }
                    window.parent.JSOSCmdContext.activeExplorerPath = currentPath || '';
                    window.parent.JSOSCmdContext.activeExplorerEntries = (currentEntries || []).map((entry) => ({
                        name: String(entry && entry.name ? entry.name : ''),
                        path: String(entry && entry.path ? entry.path : ''),
                        type: String(entry && entry.type ? entry.type : '')
                    }));
                }
            } catch (error) {
                // Best effort only.
            }

            renderEntries();

            preselectedName = '';
            renderPluginExtensions().catch(() => {});
        }

        function openEntry(entry) {
            if (!entry) {
                return;
            }

            if (entry.type === 'directory') {
                loadListing(entry.path).catch((error) => alert(error.message));
                return;
            }

            if (window.parent && window.parent.createWindow) {
                window.parent.createWindow(`Notepad - ${entry.name}`, `apps/notepad/index.html?path=${encodeURIComponent(entry.path)}`);
            }
        }

        async function openContextMenu(x, y, entry) {
            const menu = document.getElementById('menu');
            menu.innerHTML = '';
            const actions = await fetchActions({ entry: entry, path: currentPath });

            actions.forEach((action) => {
                const button = document.createElement('button');
                button.textContent = action.label || action.id;
                button.addEventListener('click', async () => {
                    menu.style.display = 'none';
                    try {
                        if (action.id === 'jsexplorer.open') {
                            openEntry(entry);
                            return;
                        }
                        if (action.id === 'jsexplorer.open_notepad') {
                            if (window.parent && window.parent.createWindow) {
                                window.parent.createWindow(`Notepad - ${entry.name}`, `apps/notepad/index.html?path=${encodeURIComponent(entry.path)}`);
                            }
                            return;
                        }
                        if (action.id === 'jsexplorer.delete_file') {
                            const ok = window.confirm(`Delete file "${entry.name}"?`);
                            if (!ok) {
                                return;
                            }
                            await executeAction(action.id, { entry: entry, filePath: entry.path, path: currentPath });
                            await loadListing(currentPath);
                            showStatus('File deleted');
                            return;
                        }
                        await executeAction(action.id, { entry: entry, path: currentPath });
                        await loadListing(currentPath);
                        showStatus(action.label || action.id);
                    } catch (error) {
                        alert(error.message);
                    }
                });
                menu.appendChild(button);
            });

            menu.style.left = `${x}px`;
            menu.style.top = `${y}px`;
            menu.style.display = 'block';
        }

        async function createFolder() {
            const folderName = prompt('Folder name');
            if (!folderName) {
                return;
            }
            await executeAction('jsexplorer.new_folder', { path: currentPath, name: folderName });
            await loadListing(currentPath);
            showStatus('Folder created');
        }

        document.getElementById('upButton').addEventListener('click', () => {
            const parts = currentPath.split('/').filter(Boolean);
            parts.pop();
            loadListing(parts.join('/')).catch((error) => alert(error.message));
        });
        document.getElementById('refreshButton').addEventListener('click', () => loadListing(currentPath).catch((error) => alert(error.message)));
        document.getElementById('newFolderButton').addEventListener('click', () => createFolder().catch((error) => alert(error.message)));
        document.getElementById('openButton').addEventListener('click', () => openEntry(selectedEntry));
        document.getElementById('openNotepadButton').addEventListener('click', () => {
            if (selectedEntry && selectedEntry.type === 'file' && window.parent && window.parent.createWindow) {
                window.parent.createWindow(`Notepad - ${selectedEntry.name}`, `apps/notepad/index.html?path=${encodeURIComponent(selectedEntry.path)}`);
            }
        });
        document.getElementById('deleteFilesButton').addEventListener('click', () => setDeleteMode(true));
        document.getElementById('selectAllDeleteButton').addEventListener('click', selectAllFiles);
        document.getElementById('unselectAllDeleteButton').addEventListener('click', unselectAllFiles);
        document.getElementById('confirmDeleteSelectedButton').addEventListener('click', () => {
            deleteSelectedFiles().catch((error) => alert(error.message));
        });
        document.getElementById('cancelDeleteModeButton').addEventListener('click', () => setDeleteMode(false));

        document.addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
        });

        const startupParams = new URLSearchParams(window.location.search);
        const startupPath = startupParams.get('path') || '';
        preselectedName = startupParams.get('select') || '';

        loadListing(startupPath).catch((error) => alert(error.message));
    </script>
</body>
</html>

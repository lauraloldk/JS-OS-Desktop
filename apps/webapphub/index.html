<!DOCTYPE html>
<html>
<head>
    <title>WebApp Hub</title>
    <script>
        const start_titel = 'WebApp Hub';
    </script>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI, sans-serif;
            background: linear-gradient(180deg, #f7fafc 0%, #e9f1f8 100%);
            color: #1d2f44;
            overflow: hidden;
        }

        .layout {
            height: 100vh;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 10px;
            padding: 12px;
            box-sizing: border-box;
            min-height: 0;
        }

        .bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            border: 1px solid #c6d6e8;
            border-radius: 8px;
            padding: 8px 10px;
            font: inherit;
            box-sizing: border-box;
            cursor: pointer;
        }

        button.primary {
            background: #2f78c5;
            border-color: #2f78c5;
            color: #fff;
        }

        button.secondary {
            background: #fff;
            color: #2e4f74;
        }

        .panes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            min-height: 0;
        }

        .panel {
            background: #fff;
            border: 1px solid #d8e2ee;
            border-radius: 10px;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
            min-height: 0;
        }

        .panel-header {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e9f2;
            font-weight: 700;
            background: #f5f9fd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-body {
            padding: 10px;
            overflow: auto;
            display: grid;
            gap: 8px;
            align-content: start;
            min-height: 0;
        }

        .card {
            border: 1px solid #d8e2ee;
            border-radius: 8px;
            padding: 9px;
            background: #fff;
            display: grid;
            gap: 7px;
        }

        .meta {
            font-size: 12px;
            color: #5a738d;
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status {
            position: fixed;
            right: 12px;
            bottom: 12px;
            background: rgba(26, 38, 52, 0.92);
            color: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            display: none;
            max-width: min(520px, calc(100vw - 24px));
        }

        @media (max-width: 1000px) {
            .panes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="bar">
            <button id="refreshButton" class="primary">Refresh Packages</button>
            <button id="refreshInstalledButton" class="secondary">Refresh Installed</button>
            <span id="sourceMeta" class="meta">Primary package source: github.com/lauraloldk/JS-OS-Desktop/tree/main/packages</span>
        </div>

        <div class="bar">
            <span class="meta">Install/update reads each package manifest.json and applies its install mapping.</span>
        </div>

        <div class="panes">
            <div class="panel">
                <div class="panel-header">
                    <span>Available Packages</span>
                </div>
                <div id="packagesList" class="panel-body"></div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span>Installed Packages</span>
                </div>
                <div id="installedList" class="panel-body"></div>
            </div>
        </div>
    </div>

    <div id="status" class="status"></div>

    <script>
        const PACKAGES_ENDPOINT = '../../plugins/packages';
        const INSTALL_ENDPOINT = '../../plugins/install';
        const UPDATE_ENDPOINT = '../../plugins/update';
        const UNINSTALL_ENDPOINT = '../../plugins/uninstall';

        let currentPackages = [];

        function showStatus(message) {
            const node = document.getElementById('status');
            node.textContent = String(message || '');
            node.style.display = 'block';
            clearTimeout(showStatus.timer);
            showStatus.timer = setTimeout(() => {
                node.style.display = 'none';
            }, 3200);
        }

        async function postAction(url, payload) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload || {})
            });

            const data = await response.json();
            if (!response.ok || data.status === 'error') {
                throw new Error(data.message || data.error || `Action failed (${response.status})`);
            }
            return data;
        }

        async function getPackages() {
            const response = await fetch(PACKAGES_ENDPOINT, { cache: 'no-store' });
            const payload = await response.json();
            if (!response.ok) {
                throw new Error(payload.error || payload.message || `Failed to load packages (${response.status})`);
            }
            return Array.isArray(payload.packages) ? payload.packages : [];
        }

        function createAvailablePackageCard(pkg) {
            const card = document.createElement('div');
            card.className = 'card';

            const title = document.createElement('strong');
            title.textContent = `${pkg.name || pkg.id} (${pkg.id})`;

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `Available ${pkg.version || '0.0.0'} | Source: ${pkg.source || 'unknown'}`;

            const row = document.createElement('div');
            row.className = 'row';

            const install = document.createElement('button');
            install.className = 'primary';
            install.textContent = pkg.isInstalled ? 'Already Installed' : 'Install';
            install.disabled = !!pkg.isInstalled;
            install.addEventListener('click', async () => {
                try {
                    await postAction(INSTALL_ENDPOINT, { packageId: pkg.id });
                    showStatus(`${pkg.id} installed`);
                    await refreshAll();
                } catch (error) {
                    alert(error.message);
                }
            });

            row.appendChild(install);

            card.appendChild(title);
            card.appendChild(meta);
            card.appendChild(row);
            return card;
        }

        function createInstalledPackageCard(pkg) {
            const card = document.createElement('div');
            card.className = 'card';

            const title = document.createElement('strong');
            title.textContent = `${pkg.name || pkg.id} (${pkg.id})`;

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `Installed ${pkg.installedVersion || 'unknown'} | Available ${pkg.version || 'unknown'} | Source: ${pkg.source || 'unknown'}`;

            const versionNote = document.createElement('div');
            versionNote.className = 'meta';
            if (pkg.versionState === 'newer') {
                versionNote.textContent = 'Update available';
            } else if (pkg.versionState === 'same') {
                versionNote.textContent = 'Up to date';
            } else if (pkg.versionState === 'older') {
                versionNote.textContent = 'Installed version is newer than source';
            } else {
                versionNote.textContent = '';
            }

            const row = document.createElement('div');
            row.className = 'row';

            const update = document.createElement('button');
            update.className = 'secondary';
            update.textContent = pkg.updateAvailable ? 'Update' : 'Up to date';
            update.disabled = !pkg.updateAvailable;
            update.addEventListener('click', async () => {
                try {
                    await postAction(UPDATE_ENDPOINT, { packageId: pkg.id });
                    showStatus(`${pkg.id} updated`);
                    await refreshAll();
                } catch (error) {
                    alert(error.message);
                }
            });

            const uninstall = document.createElement('button');
            uninstall.className = 'secondary';
            uninstall.textContent = 'Uninstall';
            uninstall.addEventListener('click', async () => {
                const ok = confirm(`Uninstall package ${pkg.id}?`);
                if (!ok) {
                    return;
                }

                try {
                    await postAction(UNINSTALL_ENDPOINT, { packageId: pkg.id });
                    showStatus(`${pkg.id} uninstalled`);
                    await refreshAll();
                } catch (error) {
                    alert(error.message);
                }
            });

            row.appendChild(update);
            row.appendChild(uninstall);

            card.appendChild(title);
            card.appendChild(meta);
            if (versionNote.textContent) {
                card.appendChild(versionNote);
            }
            card.appendChild(row);
            return card;
        }

        function renderPackages() {
            const node = document.getElementById('packagesList');
            node.innerHTML = '';

            if (!currentPackages.length) {
                const empty = document.createElement('div');
                empty.className = 'meta';
                empty.textContent = 'No packages available from source.';
                node.appendChild(empty);
                return;
            }

            currentPackages.forEach((pkg) => {
                node.appendChild(createAvailablePackageCard(pkg));
            });
        }

        function renderInstalled() {
            const node = document.getElementById('installedList');
            node.innerHTML = '';

            const installed = currentPackages.filter((pkg) => !!pkg.isInstalled);
            if (!installed.length) {
                const empty = document.createElement('div');
                empty.className = 'meta';
                empty.textContent = 'No installed packages.';
                node.appendChild(empty);
                return;
            }

            installed.forEach((pkg) => {
                node.appendChild(createInstalledPackageCard(pkg));
            });
        }

        async function refreshAll() {
            currentPackages = await getPackages();
            renderPackages();
            renderInstalled();
        }

        function bind() {
            document.getElementById('refreshButton').addEventListener('click', () => {
                refreshAll().catch((error) => alert(error.message));
            });
            document.getElementById('refreshInstalledButton').addEventListener('click', () => {
                refreshAll().catch((error) => alert(error.message));
            });
        }

        async function init() {
            bind();
            await refreshAll();
        }

        init().catch((error) => alert(error.message));
    </script>
</body>
</html>

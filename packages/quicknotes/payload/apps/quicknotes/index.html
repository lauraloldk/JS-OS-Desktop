<!DOCTYPE html>
<html>
<head>
    <title>Quick Notes</title>
    <script>
        const start_titel = 'Quick Notes';
    </script>
    <style>
        body {
            margin: 0;
            font-family: Segoe UI, sans-serif;
            background: linear-gradient(180deg, #f8fbff 0%, #eef5ff 100%);
            color: #1a2b3c;
        }

        .shell {
            display: grid;
            grid-template-rows: auto auto 1fr;
            height: 100vh;
            padding: 12px;
            box-sizing: border-box;
            gap: 10px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
        }

        button {
            border: 1px solid #b7cae2;
            background: #fff;
            border-radius: 8px;
            padding: 8px 10px;
            cursor: pointer;
        }

        input {
            border: 1px solid #c8d9ee;
            border-radius: 8px;
            padding: 8px 10px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid #c8d9ee;
            border-radius: 10px;
            padding: 12px;
            resize: none;
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="toolbar">
            <button id="newButton">New</button>
            <button id="saveButton">Save</button>
            <button id="loadButton">Load</button>
        </div>
        <input id="titleInput" type="text" placeholder="Note title">
        <textarea id="contentInput" placeholder="Write your note..."></textarea>
    </div>

    <script>
        function keyForTitle(title) {
            return `jsos.quicknotes.${String(title || '').trim().toLowerCase()}`;
        }

        function saveNote() {
            const title = document.getElementById('titleInput').value.trim();
            const content = document.getElementById('contentInput').value;
            if (!title) {
                alert('Enter a note title first.');
                return;
            }
            localStorage.setItem(keyForTitle(title), content);
            alert('Note saved.');
        }

        function loadNote() {
            const title = document.getElementById('titleInput').value.trim();
            if (!title) {
                alert('Enter a note title first.');
                return;
            }
            const content = localStorage.getItem(keyForTitle(title));
            document.getElementById('contentInput').value = content || '';
        }

        function newNote() {
            document.getElementById('titleInput').value = '';
            document.getElementById('contentInput').value = '';
        }

        document.getElementById('newButton').addEventListener('click', newNote);
        document.getElementById('saveButton').addEventListener('click', saveNote);
        document.getElementById('loadButton').addEventListener('click', loadNote);
    </script>
</body>
</html>
